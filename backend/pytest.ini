[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
# Tests never touch PostgreSQL/Redis: these are forced; the rest only apply when not already set.
env =
    DATABASE_URL=sqlite:///:memory:
    REDIS_URL=locmemcache://
    EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
    PASSWORD_HASHER=django.contrib.auth.hashers.MD5PasswordHasher
    D:SECRET_KEY=test-only-secret-key-not-for-use-outside-pytest
    D:JWT_SIGNING_KEY=test-only-jwt-key-not-for-use-outside-pytest
    D:DEBUG=False
    D:SECURE_SSL_REDIRECT=False
    D:THROTTLE_REGISTER=1000/hour
    DJANGO_ADMIN_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
    D:THROTTLE_OTP=1000/hour
    D:THROTTLE_OTP_VERIFY=1000/hour
    D:OTP_RESEND_COOLDOWN_SECONDS=0
    D:ADMIN_LOGIN_OTP_RESEND_COOLDOWN_SECONDS=0
    D:ADMIN_LOGIN_OTP_MAX_PER_HOUR=100000
    D:THROTTLE_LOGIN=1000/minute
    D:THROTTLE_TWO_FACTOR=1000/minute
    D:THROTTLE_PASSWORD_RESET=1000/hour
    D:THROTTLE_VIEWER=100000/minute
    D:THROTTLE_CHECKOUT=100000/hour
    D:THROTTLE_ANON=100000/minute
    D:THROTTLE_USER=100000/minute
    D:FIELD_ENCRYPTION_KEY=DjjEHBgBsvHmrGpSg7dVuFHrubFH-67Uq-j3zcZKdwE=
